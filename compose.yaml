
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    ports:
      - "8000:80"
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: fyp
      DB_USERNAME: fyp_user
      DB_PASSWORD: local_fyp_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laravel_network

  db:
    image: mariadb:10.11
    container_name: laravel_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: fyp
      MARIADB_USER: fyp_user
      MARIADB_PASSWORD: local_fyp_password
      MARIADB_ROOT_PASSWORD: local_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./DB/fyp.sql:/docker-entrypoint-initdb.d/01-fyp.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - laravel_network

volumes:
  mariadb_data:

networks:
  laravel_network:
    driver: bridge
